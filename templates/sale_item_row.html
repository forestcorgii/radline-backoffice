{{ define "sale_item_row.html" }}
<tr>
    <td>
        <div class="searchable-dropdown">
            <input type="text" 
                   class="form-input dropdown-search" 
                   placeholder="Search Item..." 
                   value="{{ if .SelectedItemID }}{{ range .Items }}{{ if eq .ID $.SelectedItemID }}{{ .Description }}{{ end }}{{ end }}{{ end }}"
                   onfocus="showDropdown(this)"
                   onblur="hideDropdown(this)"
                   oninput="filterDropdown(this)"
                   onkeydown="handleDropdownKeydown(event, this)"
                   style="width: 100%; padding: 0.75rem 1rem; height: auto;" 
                   required>
            <input type="hidden" 
                   name="item_id" 
                   value="{{ if .SelectedItemID }}{{ .SelectedItemID }}{{ end }}"
                   hx-get="/sales/item-row-details" 
                   hx-include="this"
                   hx-target="closest tr" 
                   hx-swap="outerHTML" 
                   hx-trigger="change">
            <div class="dropdown-list">
                {{ range .Items }}
                <div class="dropdown-item" 
                     data-id="{{ .ID }}" 
                     data-description="{{ .Description }}"
                     onmousedown="selectDropdownItem(this)">
                    {{ .Description }}
                </div>
                {{ end }}
            </div>
        </div>
    </td>
    <td>
        <input type="text" name="ref_pl" class="form-input" value="{{ .PLNo }}" readonly placeholder="N/A" style="background-color: rgba(0,0,0,0.03); color: var(--text-muted); cursor: not-allowed;">
    </td>
    <td>
        <input type="text" name="uom" placeholder="e.g. PCS" class="form-input" value="{{ .DefaultUOM }}" required>
    </td>
    <td>
        <input type="number" step="any" name="qty" class="form-input" value="{{ if .Qty }}{{ .Qty }}{{ end }}" required>
    </td>
    <td>
        <input type="number" step="any" name="price" class="form-input" value="{{ if .Price }}{{ printf "%.2f" .Price }}{{ end }}" required>
    </td>
    <td>
        <input type="number" step="any" name="cost" class="form-input" value="{{ if .Cost }}{{ printf "%.2f" .Cost }}{{ end }}" required>
    </td>
    <td>
        <div class="actions-cell">
            <button type="button" class="btn btn-danger btn-icon" onclick="this.closest('tr').remove()" title="Remove">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </td>
</tr>
{{ end }}
