<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - RAV BackOffice</title>
    <script src="/static/htmx.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css?v=7.0">
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RAV">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 0%, hsl(214 100% 94%) 0%, hsl(214 33% 97%) 55%, hsl(214 32% 94%) 100%);
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.1), 0 8px 16px -8px rgba(37, 99, 235, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2.25rem;
        }
        .brand-badge {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, hsl(217 91% 55%) 0%, hsl(224 85% 46%) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0 auto 1.125rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.32);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-badge">R</div>
                <h1 style="font-size: 1.375rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.35rem; letter-spacing: -0.02em;">RAV BackOffice</h1>
                <p style="font-size: 0.84375rem; color: var(--text-muted);">Sign in with your assigned account to proceed</p>
            </div>

            <form hx-post="/login" hx-target="#login-feedback" hx-swap="innerHTML">
                <div class="form-group" style="margin-bottom: 1.125rem;">
                    <label style="display: block; font-size: 0.78125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Username</label>
                    <input type="text" name="username" required autofocus placeholder="e.g. admin"
                           class="form-input" style="height: 2.5rem; font-size: 0.875rem;" autocomplete="username">
                </div>

                <div class="form-group" style="margin-bottom: 1.35rem;">
                    <label style="display: block; font-size: 0.78125rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem;">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="form-input" style="height: 2.5rem; font-size: 0.875rem;" autocomplete="current-password">
                </div>

                <div id="login-feedback" style="min-height: 1.5rem; margin-bottom: 0.75rem;"></div>

                <button type="submit" class="btn" style="width: 100%; height: 2.625rem; font-size: 0.875rem; font-weight: 600; justify-content: center; cursor: pointer;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.75rem; color: var(--text-muted);">
                Protected BackOffice System &bull; RAV Enterprise Suite
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
    <script>
        document.body.addEventListener('show-toast', function(evt) {
            const data = evt.detail;
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (data.type || 'info');
            toast.innerText = data.message || '';
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-fade');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .catch(function(err) {
                        console.warn('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>
</html>
