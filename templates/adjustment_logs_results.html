{{ define "adjustment_logs_results.html" }}
<div class="table-container">
    <table class="table-scroll-md resizable-table adjustment-logs-table">
        <thead>
            <tr>
                <th data-col="adj_id">Adj#</th>
                <th data-col="date">Date</th>
                <th data-col="item_description">Item Description</th>
                <th data-col="adj_qty">Adj Qty</th>
                <th data-col="uom">UOM</th>
                <th data-col="cost_impact">Cost Impact</th>
                <th data-col="remarks">Remarks</th>
            </tr>
        </thead>
        <tbody id="adjustment-logs-tbody">
            {{ template "adjustment_rows.html" .AdjustmentLogs }}
        </tbody>
    </table>
</div>
{{ end }}
