{{ define "monthly_inventory_results.html" }}
<div class="table-container">
    <table class="table-scroll-md">
        <thead>
            <tr>
                <th data-col="month" style="width: 15%;">Month</th>
                <th data-col="description" style="width: 25%;">Description</th>
                <th data-col="uom" style="width: 10%;">UOM</th>
                <th data-col="received" style="width: 11%;">Received</th>
                <th data-col="sold" style="width: 11%;">Sold</th>
                <th data-col="adjusted" style="width: 11%;">Adjusted</th>
                <th data-col="net_change" style="width: 12%;">Net Change</th>
            </tr>
        </thead>
        <tbody id="monthly-inventory-tbody">
            {{ template "monthly_inventory_rows.html" .Rows }}
        </tbody>
    </table>
</div>
{{ end }}
