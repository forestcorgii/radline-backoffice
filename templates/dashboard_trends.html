{{ define "dashboard_trends.html" }}
<div style="display: flex; flex-direction: column; height: 100%; width: 100%;">
    <!-- Inline Header: Title & Subtitle + Metric Checkboxes + Timeframe Filter -->
    <div
        style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; flex-shrink: 0;">
        <!-- Left: Title & Subtitle -->
        <div>
            <div style="font-size: 0.8125rem; font-weight: 700; color: var(--text-main);">Financial Trends</div>
            <div style="font-size: 0.6875rem; color: var(--text-muted);">Compare monthly sales revenue, profit margins, and inventory intake</div>
        </div>

        <!-- Right: Metric Checkboxes (Legend) + Divider + Inline Timeframe Filter -->
        <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
            <!-- Checkboxes to hide/unhide Sales, Profit, Inventory -->
            <div style="display: flex; align-items: center; gap: 0.625rem; font-size: 0.6875rem; font-weight: 600;">
                <label
                    style="display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="toggle-chart-sales" checked
                        onchange="window.toggleChartSeries('sales', this.checked)"
                        style="accent-color: hsl(var(--primary)); cursor: pointer;">
                    <span style="color: var(--text-main);">Sales</span>
                </label>

                <label
                    style="display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="toggle-chart-profit" checked
                        onchange="window.toggleChartSeries('profit', this.checked)"
                        style="accent-color: hsl(142 72% 35%); cursor: pointer;">
                    <span style="color: var(--text-main);">Profit</span>
                </label>

                <label
                    style="display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="toggle-chart-inventory" checked
                        onchange="window.toggleChartSeries('inventory', this.checked)"
                        style="accent-color: hsl(280 65% 55%); cursor: pointer;">
                    <span style="color: var(--text-main);">Inventory</span>
                </label>
            </div>

            <!-- Subtle vertical divider -->
            <div style="width: 1px; height: 16px; background-color: var(--border-color);" class="hidden sm:block"></div>

            <!-- Inline Timeframe Filter -->
            <div style="display: flex; align-items: center; gap: 0.35rem; flex-wrap: nowrap;">
                <span
                    style="font-size: 0.6875rem; font-weight: 600; color: var(--text-muted); margin-right: 0.15rem;">Timeframe:</span>
                <input type="date" name="start_date" value="{{ .StartDateStr }}" class="form-input"
                    style="font-size: 0.6875rem; padding: 0.25rem 0.45rem; height: 1.75rem;" hx-get="/?fragment=trends"
                    hx-trigger="change" hx-target="#dashboard-trends-container" hx-include="[name='end_date']">
                <span style="font-size: 0.6875rem; color: var(--text-muted);">to</span>
                <input type="date" name="end_date" value="{{ .EndDateStr }}" class="form-input"
                    style="font-size: 0.6875rem; padding: 0.25rem 0.45rem; height: 1.75rem;" hx-get="/?fragment=trends"
                    hx-trigger="change" hx-target="#dashboard-trends-container" hx-include="[name='start_date']">
            </div>
        </div>
    </div>

    <!-- Unified Trend Chart -->
    <div style="flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <svg viewBox="0 0 910 210" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%; max-height: 100%;">
            <!-- Grid Lines -->
            <line x1="30" y1="10" x2="880" y2="10" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
            <line x1="30" y1="65" x2="880" y2="65" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
            <line x1="30" y1="120" x2="880" y2="120" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
            <line x1="30" y1="175" x2="880" y2="175" stroke="hsl(var(--border) / 0.8)" />

            {{ range .ChartBars }}
            <!-- Sales Bar -->
            <rect class="chart-bar-sales" x="{{ .SalesX }}" y="{{ .SalesY }}" width="16" height="{{ .SalesHeight }}"
                rx="2" fill="hsl(var(--primary))" style="transition: opacity 0.2s ease; opacity: 0.88;">
                <title>{{ .Label }} Sales: ₱{{ printf "%.2f" .Sales }}</title>
            </rect>

            <!-- Profit Bar -->
            <rect class="chart-bar-profit" x="{{ .ProfitX }}" y="{{ .ProfitY }}" width="16" height="{{ .ProfitHeight }}"
                rx="2" fill="hsl(142 72% 35%)" style="transition: opacity 0.2s ease; opacity: 0.88;">
                <title>{{ .Label }} Profit: ₱{{ printf "%.2f" .Profit }}</title>
            </rect>

            <!-- Inventory Bar -->
            <rect class="chart-bar-inventory" x="{{ .InventoryX }}" y="{{ .InventoryY }}" width="16"
                height="{{ .InventoryHeight }}" rx="2" fill="hsl(280 65% 55%)"
                style="transition: opacity 0.2s ease; opacity: 0.88;">
                <title>{{ .Label }} Inventory Intake: ₱{{ printf "%.2f" .Inventory }}</title>
            </rect>

            <!-- X Axis Label -->
            <text x="{{ .LabelX }}" y="196" text-anchor="middle" class="text-muted"
                style="font-size: 0.6875rem; font-weight: 500;">{{ .Label }}</text>
            {{ end }}
        </svg>
    </div>
</div>

<script>
    (function () {
        window.toggleChartSeries = function (series, isVisible) {
            if (!window._chartSeriesState) {
                window._chartSeriesState = { sales: true, profit: true, inventory: true };
            }
            window._chartSeriesState[series] = isVisible;
            var elements = document.querySelectorAll('.chart-bar-' + series);
            elements.forEach(function (el) {
                el.style.display = isVisible ? '' : 'none';
            });
        };

        if (!window._chartSeriesState) {
            window._chartSeriesState = { sales: true, profit: true, inventory: true };
        }
        ['sales', 'profit', 'inventory'].forEach(function (s) {
            var chk = document.getElementById('toggle-chart-' + s);
            var visible = window._chartSeriesState[s] !== false;
            if (chk) {
                chk.checked = visible;
            }
            var elements = document.querySelectorAll('.chart-bar-' + s);
            elements.forEach(function (el) {
                el.style.display = visible ? '' : 'none';
            });
        });
    })();
</script>
{{ end }}
