{{ define "dashboard_trends.html" }}
<div class="grid grid-cols-2" style="gap: 1.25rem;">
    <!-- Sales & Profit Trend Chart -->
    <div class="card" style="padding: 1.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <div>
                <div style="font-size: 0.8125rem; font-weight: 700; color: var(--text-main);">Sales & Profit Trend</div>
                <div style="font-size: 0.6875rem; color: var(--text-muted);">Monthly revenue vs gross profit margins</div>
            </div>
            <div style="display: flex; gap: 0.75rem; font-size: 0.6875rem; font-weight: 500;">
                <div style="display: flex; align-items: center; gap: 0.25rem;">
                    <div style="width: 10px; height: 10px; background-color: hsl(var(--primary)); border-radius: 2px;"></div>
                    <span class="text-muted">Total Sales</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.25rem;">
                    <div style="width: 10px; height: 10px; background-color: hsl(142 72% 35%); border-radius: 2px;"></div>
                    <span class="text-muted">Gross Profit</span>
                </div>
            </div>
        </div>

        <div style="width: 100%; display: flex; justify-content: center;">
            <svg viewBox="0 0 520 210" style="width: 100%; height: auto; max-height: 210px;">
                <!-- Grid Lines -->
                <line x1="30" y1="10" x2="500" y2="10" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
                <line x1="30" y1="65" x2="500" y2="65" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
                <line x1="30" y1="120" x2="500" y2="120" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
                <line x1="30" y1="175" x2="500" y2="175" stroke="hsl(var(--border) / 0.8)" />
                
                {{ range .ChartBars }}
                <!-- Sales Bar -->
                <rect x="{{ .SalesX }}" y="{{ .SalesY }}" width="15" height="{{ .SalesHeight }}" rx="2" fill="hsl(var(--primary))" style="transition: all 0.2s ease; opacity: 0.88;">
                    <title>{{ .Label }} Sales: ₱{{ printf "%.2f" .Sales }}</title>
                </rect>
                
                <!-- Profit Bar -->
                <rect x="{{ .ProfitX }}" y="{{ .ProfitY }}" width="15" height="{{ .ProfitHeight }}" rx="2" fill="hsl(142 72% 35%)" style="transition: all 0.2s ease; opacity: 0.88;">
                    <title>{{ .Label }} Profit: ₱{{ printf "%.2f" .Profit }}</title>
                </rect>
                
                <!-- X Axis Label -->
                <text x="{{ .LabelX }}" y="196" text-anchor="middle" class="text-muted" style="font-size: 0.6875rem; font-weight: 500;">{{ .Label }}</text>
                {{ end }}
            </svg>
        </div>
    </div>

    <!-- Sales & Total Inventory Trend Chart -->
    <div class="card" style="padding: 1.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <div>
                <div style="font-size: 0.8125rem; font-weight: 700; color: var(--text-main);">Sales & Inventory Trend</div>
                <div style="font-size: 0.6875rem; color: var(--text-muted);">Comparing sales revenue vs inventory intake</div>
            </div>
            <div style="display: flex; gap: 0.75rem; font-size: 0.6875rem; font-weight: 500;">
                <div style="display: flex; align-items: center; gap: 0.25rem;">
                    <div style="width: 10px; height: 10px; background-color: hsl(var(--primary)); border-radius: 2px;"></div>
                    <span class="text-muted">Sales</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.25rem;">
                    <div style="width: 10px; height: 10px; background-color: hsl(280 65% 55%); border-radius: 2px;"></div>
                    <span class="text-muted">Inventory Intake</span>
                </div>
            </div>
        </div>

        <div style="width: 100%; display: flex; justify-content: center;">
            <svg viewBox="0 0 520 210" style="width: 100%; height: auto; max-height: 210px;">
                <!-- Grid Lines -->
                <line x1="30" y1="10" x2="500" y2="10" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
                <line x1="30" y1="65" x2="500" y2="65" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
                <line x1="30" y1="120" x2="500" y2="120" stroke="hsl(var(--border) / 0.6)" stroke-dasharray="3" />
                <line x1="30" y1="175" x2="500" y2="175" stroke="hsl(var(--border) / 0.8)" />
                
                {{ range .InvChartBars }}
                <!-- Sales Bar -->
                <rect x="{{ .SalesX }}" y="{{ .SalesY }}" width="15" height="{{ .SalesH }}" rx="2" fill="hsl(var(--primary))" style="transition: all 0.2s ease; opacity: 0.88;">
                    <title>{{ .Label }} Sales: ₱{{ printf "%.2f" .Sales }}</title>
                </rect>
                
                <!-- Inventory Bar -->
                <rect x="{{ .InvX }}" y="{{ .InvY }}" width="15" height="{{ .InvH }}" rx="2" fill="hsl(280 65% 55%)" style="transition: all 0.2s ease; opacity: 0.88;">
                    <title>{{ .Label }} Inventory Intake: ₱{{ printf "%.2f" .Inventory }}</title>
                </rect>
                
                <!-- X Axis Label -->
                <text x="{{ .LabelX }}" y="196" text-anchor="middle" class="text-muted" style="font-size: 0.6875rem; font-weight: 500;">{{ .Label }}</text>
                {{ end }}
            </svg>
        </div>
    </div>
</div>
{{ end }}
