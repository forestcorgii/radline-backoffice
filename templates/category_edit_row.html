{{ define "category_edit_row.html" }}
<tr id="category-row-{{ .ID }}" class="edit-row">
    <td>{{ .ID }}</td>
    <td>
        <input type="text" id="edit-code-{{ .ID }}" name="code" value="{{ .Code }}" required class="form-input">
    </td>
    <td>
        <input type="text" id="edit-name-{{ .ID }}" name="name" value="{{ .Name }}" required class="form-input">
    </td>
    <td>
        <span class="badge {{ if gt .ItemCount 0 }}badge-active{{ else }}badge-inactive{{ end }}">
            {{ .ItemCount }} items
        </span>
    </td>
    <td>
        <div class="actions-cell">
            <button class="btn btn-success btn-icon" 
                    hx-post="/categories/edit/{{ .ID }}" 
                    hx-include="closest tr" 
                    hx-target="#category-row-{{ .ID }}" 
                    hx-swap="outerHTML"
                    title="Save">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
            <button class="btn btn-secondary btn-icon" 
                    hx-get="/categories/row/{{ .ID }}" 
                    hx-target="#category-row-{{ .ID }}" 
                    hx-swap="outerHTML"
                    title="Cancel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </td>
</tr>
{{ end }}
