{{ define "sales_results.html" }}
<div class="table-container">
    <table class="table-scroll-lg">
        <thead>
            <tr>
                <th data-col="doc_date">Date</th>
                <th data-col="doc_type_number">Doc Type / Number</th>
                <th data-col="supplier">Supplier</th>
                <th data-col="item_description">Item Description</th>
                <th data-col="qty">Qty</th>
                <th data-col="uom">UOM</th>
                <th data-col="total_sales">Total Sales</th>
                <th data-col="total_cost">Total Cost</th>
                <th data-col="profit">Profit</th>
                <th data-col="actions">Actions</th>
            </tr>
        </thead>
        <tbody id="sales-tbody">
            {{ template "sales_rows.html" .Sales }}
        </tbody>
    </table>
</div>
{{ end }}
