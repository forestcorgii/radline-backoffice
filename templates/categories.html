{{ define "categories.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="header-bar">
    <h2 style="margin: 0;">Categories</h2>
    <a href="/categories/new" hx-get="/categories/new" hx-target="#main-content" hx-push-url="true" class="btn" style="padding: 0.5rem 1rem; text-decoration: none; font-size: 0.8125rem;">
        + Add Category
    </a>
</div>

<div class="card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Categories List</h3>
    
    <form style="display: contents;" onsubmit="return false;">
    <div class="search-filter-bar">
        <div class="flex-grow">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
            <input type="text" name="search" placeholder="Search by code or name..." 
                   hx-get="/categories" 
                   hx-trigger="keyup[key=='Enter'], search" 
                   hx-target="#categories-results"
                   hx-include="closest form"
                   class="form-input">
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Usage Status</label>
            <select name="filter" class="form-input">
                <option value="all">All Usage Statuses</option>
                <option value="in_use">In Use</option>
                <option value="unused">Unused</option>
            </select>
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort By</label>
            <select name="sort" class="form-input">
                <option value="code_asc">Code (A-Z)</option>
                <option value="code_desc">Code (Z-A)</option>
                <option value="name_asc">Name (A-Z)</option>
                <option value="name_desc">Name (Z-A)</option>
                <option value="items_desc">Most Items First</option>
                <option value="items_asc">Least Items First</option>
            </select>
        </div>
        <div class="filter-item" style="width: auto;">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block; visibility: hidden;">Action</label>
            <button hx-get="/categories" 
                    hx-target="#categories-results"
                    hx-include="closest form"
                    class="btn" style="width: 100%;">
                Apply
            </button>
        </div>
    </div>

    <div id="categories-results">
    <div class="table-container">
        <table class="table-scroll-md">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Items Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="categories-tbody">
                {{ template "category_rows.html" .Categories }}
            </tbody>
        </table>
    </div>
    </div>

    {{ template "pagination.html" .PaginationView }}
    </form>
</div>
{{ end }}
