<div class="card mb-4">
    <h2 class="mb-4">New Stock Adjustment</h2>
    <form hx-post="/inventory/adjustments/add" hx-target="#adjustment-tbody" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful && event.detail.elt === this) { this.reset(); document.getElementById('adj_date').valueAsDate = new Date(); const tbody = document.getElementById('adjustment-items-tbody'); while(tbody.rows.length > 1) { tbody.deleteRow(1); } }">
        <div class="grid grid-adj-header">
            <div class="form-group">
                <label for="adj_date">Adjustment Date</label>
                <input type="date" id="adj_date" name="date" class="form-input" required>
                <script>document.currentScript.previousElementSibling.valueAsDate = new Date();</script>
            </div>
            <div class="form-group">
                <label for="adj_remarks">Remarks / Reason</label>
                <input type="text" id="adj_remarks" name="remarks"
                    placeholder="e.g. Damaged inventory, annual count adjustment" class="form-input" required>
            </div>
        </div>

        <div class="mt-4 mb-4" style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Items</h3>
        </div>

        <div class="item-grid-container">
            <div id="adjustment-items-tbody">
                {{ template "adjustment_item_row.html" .AdjustmentRowData }}
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;"
            class="mt-4">
            <button type="button" class="btn btn-secondary" hx-get="/inventory/adjustments/new-row"
                hx-target="#adjustment-items-tbody" hx-swap="beforeend">
                + Add Item Row
            </button>
            <button type="submit" class="btn">Commit Adjustment</button>
        </div>
    </form>
</div>
{{ end }}
