{{ define "inventory_stock_results.html" }}
<div class="table-container">
    <table class="table-scroll-md resizable-table inventory-stock-table">
        <thead>
            <tr>
                <th data-col="description" style="width: 36%;">Description</th>
                <th data-col="uom" style="width: 8%;">UOM</th>
                <th data-col="received" style="width: 10%;">Received</th>
                <th data-col="sold" style="width: 8%;">Sold</th>
                <th data-col="adjusted" style="width: 10%;">Adjusted</th>
                <th data-col="on_hand" style="width: 10%;">On Hand</th>
                <th data-col="current_cost" style="width: 9%;">Current Cost</th>
                <th data-col="current_price" style="width: 9%;">Current Price</th>
            </tr>
        </thead>
        <tbody id="inventory-stock-tbody">
            {{ template "inventory_stock_rows.html" .StockItems }}
        </tbody>
    </table>
</div>
{{ end }}
