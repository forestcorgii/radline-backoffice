{{ define "items.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="header-bar">
    <h2 style="margin: 0;">Items</h2>
    <a href="/items/new" hx-get="/items/new" hx-target="#main-content" hx-push-url="true" class="btn" style="padding: 0.5rem 1rem; text-decoration: none; font-size: 0.8125rem;">
        + Add Item
    </a>
</div>

<!-- Non-collapsible Items List Card occupying the full width -->
<div class="card" id="items-card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Items List</h3>
    
    <form style="display: contents;" onsubmit="return false;">
    <div class="search-filter-bar">
        <div class="flex-grow">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
            <input type="text" name="search" placeholder="Search items by code, description, or model..." 
                   hx-get="/items" 
                   hx-trigger="keyup[key=='Enter'], search" 
                   hx-target="#items-results" 
                   hx-include="closest form"
                   class="form-input">
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Brand Filter</label>
            <select name="brand_id_filter" class="form-input">
                <option value="0">All Brands</option>
                {{ range .Brands }}
                <option value="{{ .ID }}">{{ .Name }}</option>
                {{ end }}
            </select>
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Category Filter</label>
            <select name="category_id_filter" class="form-input">
                <option value="0">All Categories</option>
                {{ range .Categories }}
                <option value="{{ .ID }}">{{ .Name }}</option>
                {{ end }}
            </select>
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort By</label>
            <select name="sort" class="form-input">
                <option value="code_asc">Code (A-Z)</option>
                <option value="code_desc">Code (Z-A)</option>
                <option value="description_asc">Description (A-Z)</option>
                <option value="description_desc">Description (Z-A)</option>
            </select>
        </div>
        <div class="filter-item" style="width: auto;">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block; visibility: hidden;">Action</label>
            <button hx-get="/items" 
                    hx-target="#items-results" 
                    hx-include="closest form"
                    class="btn" style="width: 100%;">
                Apply
            </button>
        </div>
    </div>

    <div id="items-results">
        <div class="table-container">
            <table class="table-scroll-md">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Description</th>
                        <th>Model</th>
                        <th>Brand</th>
                        <th>Category</th>
                        <th>Default UOM</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="items-tbody">
                    {{ template "item_rows.html" .Items }}
                </tbody>
            </table>
        </div>
    </div>

    {{ template "pagination.html" .PaginationView }}
    </form>
</div>
{{ end }}
