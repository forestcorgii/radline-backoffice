{{ define "sales_new.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div style="margin-bottom: 1.5rem;">
    <a href="/sales" hx-get="/sales" hx-target="#main-content" hx-push-url="true" class="btn btn-secondary" style="padding: 0.5rem 1rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
        ← Back to Sales
    </a>
</div>

<div class="card">
    <h2 class="mb-4">Encode Sales</h2>
    <form hx-post="/sales/add" hx-swap="none" hx-on::after-request="if(event.detail.successful && event.detail.elt === this) { this.reset(); document.getElementById('doc_date').valueAsDate = new Date(); }">
        <div class="grid grid-cols-5">
            <div class="form-group">
                <label for="doc_date">Document Date</label>
                <input type="date" id="doc_date" name="doc_date" required>
                <script>document.currentScript.previousElementSibling.valueAsDate = new Date();</script>
            </div>
            <div class="form-group">
                <label for="doc_type">Doc Type</label>
                <select id="doc_type" name="doc_type" class="form-input" style="padding: 0.75rem 1rem; height: auto;" required>
                    <option value="SI">Sales Invoice (SI)</option>
                    <option value="DR">Delivery Receipt (DR)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="doc_number">Doc Number</label>
                <input type="text" id="doc_number" name="doc_number" required>
            </div>
            <div class="form-group">
                <label for="customer_name">Customer Name</label>
                <input type="text" id="customer_name" name="customer_name">
            </div>
            <div class="form-group">
                <label for="supplier">Supplier</label>
                <select id="supplier" name="supplier" class="form-input" style="padding: 0.75rem 1rem; height: auto;" required>
                    <option value="ASCD">ASCD</option>
                    <option value="RENOWN">RENOWN</option>
                    <option value="OTHER">OTHER</option>
                </select>
            </div>
        </div>
        
        <div class="mt-4 mb-4" style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Items</h3>
        </div>

        <div class="item-grid-container">
            <div id="sales-items-tbody">
                {{ template "sale_item_row.html" .SalesRowData }}
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;" class="mt-4">
            <button type="button" class="btn btn-secondary" hx-get="/sales/new-row" hx-target="#sales-items-tbody" hx-swap="beforeend">
                + Add Item Row
            </button>
            <button type="submit" class="btn">Save Sales Log</button>
        </div>
    </form>
</div>
{{ end }}
