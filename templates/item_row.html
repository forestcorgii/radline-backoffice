{{ define "item_row.html" }}
<tr id="item-row-{{ .ID }}">
    <td data-col="description" style="font-weight: 500;">{{ .Description }}</td>
    <td data-col="model">{{ if .Model }}{{ .Model }}{{ else }}-{{ end }}</td>
    <td data-col="brand">{{ if .BrandName }}{{ .BrandName }}{{ else }}-{{ end }}</td>
    <td data-col="category">{{ if .CategoryName }}{{ .CategoryName }}{{ else }}-{{ end }}</td>
    <td data-col="default_uom"><span class="badge badge-active">{{ .DefaultUOM }}</span></td>
    <td data-col="actions">
        <div class="actions-cell">
            <button class="btn btn-secondary btn-icon" hx-get="/items/edit/{{ .ID }}" hx-target="#item-row-{{ .ID }}"
                hx-swap="outerHTML" title="Edit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
            </button>
            <button class="btn btn-danger btn-icon" hx-delete="/items/delete/{{ .ID }}"
                hx-confirm="Are you sure you want to delete the item '{{ .Description }}'?"
                hx-target="#item-row-{{ .ID }}" hx-swap="outerHTML" title="Delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </td>
</tr>
{{ end }}
