{{ define "adjust_stock_form.html" }}
<!-- Adjust Stock Form Card (hidden by default, shown when Adjust Stock is clicked) -->
<div class="card mb-4" id="adjust-stock-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin: 0;">New Stock Adjustment</h3>
        <button type="button" class="btn btn-secondary" onclick="toggleAdjustStockForm()" style="padding: 0.35rem 0.75rem; font-size: 0.8125rem;">
            ✕ Close
        </button>
    </div>
    <form hx-post="/inventory/adjustments/add" hx-swap="none" hx-on::after-request="if(event.detail.successful && event.detail.elt === this) { this.reset(); document.getElementById('adj_date').valueAsDate = new Date(); const tbody = document.getElementById('adjustment-items-tbody'); if (tbody) { while(tbody.children.length > 1) { tbody.removeChild(tbody.lastChild); } } toggleAdjustStockForm(); }">
        <div class="grid grid-adj-header">
            <div class="form-group">
                <label for="adj_date">Adjustment Date</label>
                <input type="date" id="adj_date" name="date" class="form-input" required>
                <script>document.currentScript.previousElementSibling.valueAsDate = new Date();</script>
            </div>
            <div class="form-group">
                <label for="adj_remarks">Remarks / Reason</label>
                <input type="text" id="adj_remarks" name="remarks" placeholder="e.g. Damaged inventory, annual count adjustment" class="form-input" required>
            </div>
        </div>

        <div class="mt-4 mb-4" style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Items</h3>
        </div>

        <div class="excel-table-container">
            <table class="excel-table" style="min-width: 800px;">
                <thead>
                    <tr>
                        <th style="width: 350px;">Item Description</th>
                        <th style="width: 120px;">UOM</th>
                        <th style="width: 150px;">Adj Qty (Negative to subtract)</th>
                        <th style="width: 130px;">Unit Cost</th>
                        <th style="width: 50px; text-align: center;"></th>
                    </tr>
                </thead>
                <tbody id="adjustment-items-tbody">
                    {{ template "adjustment_item_row.html" .AdjustmentRowData }}
                </tbody>
            </table>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;" class="mt-4">
            <button type="button" class="btn btn-secondary" hx-get="/inventory/adjustments/new-row" hx-target="#adjustment-items-tbody" hx-swap="beforeend">
                + Add Item Row
            </button>
            <button type="submit" class="btn">Commit Adjustment</button>
        </div>
    </form>
</div>

<script>
    if (typeof window.toggleAdjustStockForm !== 'function') {
        window.toggleAdjustStockForm = function () {
            const receiveCard = document.getElementById('receive-stock-card');
            const adjustCard = document.getElementById('adjust-stock-card');
            if (receiveCard) receiveCard.style.display = 'none';
            if (!adjustCard) return;
            if (adjustCard.style.display === 'none' || adjustCard.style.display === '') {
                adjustCard.style.display = 'block';
                adjustCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                adjustCard.style.display = 'none';
            }
        };
    }
</script>
{{ end }}
