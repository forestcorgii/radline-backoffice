{{ define "adjustment_logs.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="card">
    <h2>Adjustment Logs</h2>
    
    <form style="display: contents;" onsubmit="return false;">
    <div class="search-filter-bar">
        <div class="flex-grow">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
            <input type="text" name="search" placeholder="Search by Remarks, Item Code, or Adjustment ID..." 
                   hx-get="/inventory/adjustments/logs" 
                   hx-trigger="keyup[key=='Enter'], search" 
                   hx-target="#adjustment-logs-results" 
                   hx-include="closest form"
                   class="form-input">
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort By</label>
            <select name="sort" class="form-input">
                <option value="date_desc">Newest First</option>
                <option value="date_asc">Oldest First</option>
                <option value="qty_desc">Highest Abs(Quantity) First</option>
            </select>
        </div>
        <div class="filter-item" style="width: auto;">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block; visibility: hidden;">Action</label>
            <button hx-get="/inventory/adjustments/logs" 
                    hx-target="#adjustment-logs-results" 
                    hx-include="closest form"
                    class="btn" style="width: 100%;">
                Apply
            </button>
        </div>
    </div>

        <div id="adjustment-logs-results">
    <div class="table-container">
        <table class="table-scroll-md">
            <thead>
                <tr>
                    <th>Adj#</th>
                    <th>Date</th>
                    <th>Item Code</th>
                    <th>Adj Qty</th>
                    <th>UOM</th>
                    <th>Cost Impact</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="adjustment-logs-tbody">
                {{ template "adjustment_rows.html" .AdjustmentLogs }}
            </tbody>
        </table>
    </div>
    </div>

    {{ template "pagination.html" .PaginationView }}
    </form>
</div>
{{ end }}
