{{ define "receiving_logs_results.html" }}
<div class="table-container">
    <div class="table table-scroll-md resizable-table receiving-logs-table">
        <div class="thead">
            <div class="tr">
                <div class="th" data-col="date">Date</div>
                <div class="th" data-col="pl_no">PL No.</div>
                <div class="th" data-col="supplier">Supplier</div>
                <div class="th" data-col="qty">Qty</div>
                <div class="th" data-col="description">Description</div>
                <div class="th" data-col="uom">UOM</div>
                <div class="th" data-col="unit_price">Unit Price</div>
                <div class="th" data-col="less1">Less 1</div>
                <div class="th" data-col="less2">Less 2</div>
                <div class="th" data-col="unit_cost">Unit Cost</div>
                <div class="th" data-col="total_cost">Total Cost</div>
                <div class="th" data-col="markup">Markup</div>
                <div class="th" data-col="selling_price">Selling Price</div>
                <div class="th" data-col="remarks">Remarks</div>
                <div class="th" data-col="actions">Action</div>
            </div>
        </div>
        <div class="tbody" id="receiving-logs-tbody">
            {{ template "receiving_rows.html" .ReceivingLogs }}
        </div>
    </div>
</div>
{{ end }}
