{{ define "receive_stock_form.html" }}
<!-- Receive Stock Form Card (hidden by default, shown when Receive Stock is clicked) -->
<div class="card mb-4" id="receive-stock-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin: 0;">Receive Stock</h3>
        <button type="button" class="btn btn-secondary" onclick="toggleReceiveStockForm()" style="padding: 0.35rem 0.75rem; font-size: 0.8125rem;">
            ✕ Close
        </button>
    </div>
    <form hx-post="/inventory/receiving/add" hx-swap="none" hx-on::after-request="if(event.detail.successful && event.detail.elt === this) { this.reset(); document.getElementById('date').valueAsDate = new Date(); const tbody = document.getElementById('receiving-items-tbody'); if (tbody) { while(tbody.children.length > 1) { tbody.removeChild(tbody.lastChild); } } toggleReceiveStockForm(); }">
        <div class="grid grid-cols-3">
            <div class="form-group">
                <label for="pl_no">Packing List (PL) No.</label>
                <input type="text" id="pl_no" name="pl_no" class="form-input">
            </div>
            <div class="form-group">
                <label for="supplier">Supplier</label>
                <select id="supplier" name="supplier" class="form-input" style="padding: 0.75rem 1rem; height: auto;" required>
                    <option value="ASCD">ASCD</option>
                    <option value="RENOWN">RENOWN</option>
                    <option value="OTHER">OTHER</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Delivery Date</label>
                <input type="date" id="date" name="date" class="form-input" required>
                <script>document.currentScript.previousElementSibling.valueAsDate = new Date();</script>
            </div>
        </div>

        <div class="mt-4 mb-4" style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
            <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Items</h3>
        </div>

        <div class="excel-table-container">
            <table class="excel-table" style="min-width: 1100px;">
                <thead>
                    <tr>
                        <th style="width: 320px;">Item Description</th>
                        <th style="width: 110px;">UOM</th>
                        <th style="width: 80px;">Qty</th>
                        <th style="width: 110px;">Unit Cost</th>
                        <th style="width: 80px;">Less 1 (%)</th>
                        <th style="width: 80px;">Less 2 (%)</th>
                        <th style="width: 90px;">Markup (%)</th>
                        <th style="width: 180px;">Remarks</th>
                        <th style="width: 50px; text-align: center;"></th>
                    </tr>
                </thead>
                <tbody id="receiving-items-tbody">
                    {{ template "receiving_item_row.html" .ReceivingRowData }}
                </tbody>
            </table>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;" class="mt-4">
            <button type="button" class="btn btn-secondary" hx-get="/inventory/receiving/new-row" hx-target="#receiving-items-tbody" hx-swap="beforeend">
                + Add Item Row
            </button>
            <button type="submit" class="btn">Receive Stock</button>
        </div>
    </form>
</div>

<script>
    if (typeof window.toggleReceiveStockForm !== 'function') {
        window.toggleReceiveStockForm = function () {
            const receiveCard = document.getElementById('receive-stock-card');
            const adjustCard = document.getElementById('adjust-stock-card');
            if (adjustCard) adjustCard.style.display = 'none';
            if (!receiveCard) return;
            if (receiveCard.style.display === 'none' || receiveCard.style.display === '') {
                receiveCard.style.display = 'block';
                receiveCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                receiveCard.style.display = 'none';
            }
        };
    }
</script>
{{ end }}
