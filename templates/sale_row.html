{{ define "sale_row.html" }}
<tr id="sale-row-{{ .ID }}">
    <td data-col="doc_date">{{ .DocDate.Format "2006-01-02" }}</td>
    <td data-col="doc_type_number">
        <span class="badge badge-secondary">{{ .DocType }}</span>
        {{ .DocNumber }}
    </td>
    <td data-col="supplier"><span class="badge badge-primary">{{ .Supplier }}</span></td>
    <td data-col="item_description" style="font-weight: 500;">{{ .Description }}</td>
    <td data-col="qty" style="font-weight: 600;">{{ .Qty }}</td>
    <td data-col="uom">{{ .UOM }}</td>
    <td data-col="total_sales" class="text-success" style="font-weight: 500;">₱{{ printf "%.2f" .TotalSales }}</td>
    <td data-col="total_cost" class="text-danger" style="font-weight: 500;">₱{{ printf "%.2f" .TotalCost }}</td>
    <td data-col="profit" class="text-primary" style="font-weight: 500;">₱{{ printf "%.2f" .Profit }}</td>
    <td data-col="actions">
        <div class="actions-cell">
            <button class="btn btn-danger btn-icon" hx-delete="/sales/delete/{{ .ID }}"
                hx-confirm="Are you sure you want to delete this sale log?" hx-target="#sale-row-{{ .ID }}"
                hx-swap="outerHTML" title="Delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </td>
</tr>
{{ end }}
