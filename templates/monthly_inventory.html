{{ define "monthly_inventory.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="header-bar">
    <h2 style="margin: 0;">Monthly Inventory Movements</h2>
</div>

<div class="card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Inventory Movements by Month</h3>

    <form style="display: contents;" onsubmit="return false;">
        <div class="search-filter-bar">
            <div class="flex-grow">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search
                    Items</label>
                <input type="text" name="search" placeholder="Search by item description..." hx-get="/inventory/monthly"
                    hx-trigger="keyup changed delay:300ms, search" hx-target="#monthly-inventory-results"
                    hx-include="closest form" class="form-input">
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Month
                    Filter</label>
                <select name="month_filter" class="form-input" hx-get="/inventory/monthly"
                    hx-target="#monthly-inventory-results" hx-include="closest form" hx-trigger="change">
                    <option value="all">All Months</option>
                    {{ range .Months }}
                    <option value="{{ . }}">{{ . }}</option>
                    {{ end }}
                </select>
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Show
                    Rows</label>
                <select name="limit" class="form-input" hx-get="/inventory/monthly"
                    hx-target="#monthly-inventory-results" hx-include="closest form" hx-trigger="change">
                    <option value="25" selected>Top 25</option>
                    <option value="50">Top 50</option>
                    <option value="100">Top 100</option>
                    <option value="200">Top 200</option>
                    <option value="500">Top 500</option>
                </select>
            </div>
        </div>

        <div id="monthly-inventory-results">
            <div class="table-container">
                <table class="table-scroll-md">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Month</th>
                            <th style="width: 40%;">Description</th>
                            <th style="width: 10%;">UOM</th>
                            <th style="width: 11%;">Received</th>
                            <th style="width: 11%;">Sold</th>
                            <th style="width: 11%;">Adjusted</th>
                            <th style="width: 12%;">Net Change</th>
                        </tr>
                    </thead>
                    <tbody id="monthly-inventory-tbody">
                        {{ template "monthly_inventory_rows.html" .Rows }}
                    </tbody>
                </table>
            </div>
        </div>
    </form>
</div>
{{ end }}
