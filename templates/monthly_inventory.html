{{ define "monthly_inventory.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="header-bar">
    <h2 style="margin: 0;">Monthly Inventory Movements</h2>
</div>

<div class="card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Inventory Movements by Month</h3>

    <div class="search-filter-bar">
        <div class="flex-grow">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search Items</label>
            <input type="text" name="search" placeholder="Search by item code or description..."
                   hx-get="/inventory/monthly"
                   hx-trigger="keyup changed delay:300ms, search"
                   hx-target="#monthly-inventory-tbody"
                   hx-include="[name='month_filter']"
                   class="form-input">
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Month Filter</label>
            <select name="month_filter"
                    hx-get="/inventory/monthly"
                    hx-target="#monthly-inventory-tbody"
                    hx-include="[name='search']"
                    hx-trigger="change"
                    class="form-input">
                <option value="all">All Months</option>
                {{ range .Months }}
                <option value="{{ . }}">{{ . }}</option>
                {{ end }}
            </select>
        </div>
    </div>

    <div class="table-container">
        <table class="table-scroll-md">
            <thead>
                <tr>
                    <th style="width: 15%;">Month</th>
                    <th style="width: 15%;">Item Code</th>
                    <th style="width: 25%;">Description</th>
                    <th style="width: 10%;">UOM</th>
                    <th style="width: 11%;">Received</th>
                    <th style="width: 11%;">Sold</th>
                    <th style="width: 11%;">Adjusted</th>
                    <th style="width: 12%;">Net Change</th>
                </tr>
            </thead>
            <tbody id="monthly-inventory-tbody">
                {{ template "monthly_inventory_rows.html" .Rows }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
