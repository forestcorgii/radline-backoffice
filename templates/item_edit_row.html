{{ define "item_edit_row.html" }}
<div id="item-row-{{ .Item.ID }}" class="tr edit-row">
    <div class="td" data-col="description">
        <input type="hidden" name="code" value="{{ .Item.Code }}">
        <input type="text" name="description" value="{{ .Item.Description }}" required class="form-input" style="font-weight: 500;">
    </div>
    <div class="td" data-col="model">
        <input type="text" name="model" value="{{ .Item.Model }}" class="form-input">
    </div>
    <div class="td" data-col="brand">
        <select name="brand_id" class="form-input" style="padding: 0.5rem 0.5rem; height: auto;">
            <option value="0">-- No Brand --</option>
            {{ $selectedBrand := derefInt .Item.BrandID }}
            {{ range .Brands }}
            <option value="{{ .ID }}" {{ if eq .ID $selectedBrand }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </div>
    <div class="td" data-col="category">
        <select name="category_id" class="form-input" style="padding: 0.5rem 0.5rem; height: auto;">
            <option value="0">-- No Category --</option>
            {{ $selectedCategory := derefInt .Item.CategoryID }}
            {{ range .Categories }}
            <option value="{{ .ID }}" {{ if eq .ID $selectedCategory }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
        </select>
    </div>
    <div class="td" data-col="default_uom">
        <select name="default_uom" required class="form-input" style="padding: 0.5rem 0.5rem; height: auto;">
            {{ $selectedUOM := .Item.DefaultUOM }}
            {{ range .Uoms }}
            <option value="{{ .Code }}" {{ if eq .Code $selectedUOM }}selected{{ end }}>{{ .Code }}</option>
            {{ end }}
        </select>
    </div>
    <div class="td" data-col="actions">
        <div class="actions-cell">
            <button class="btn btn-success btn-icon" 
                    hx-post="/items/edit/{{ .Item.ID }}" 
                    hx-include="closest .tr" 
                    hx-target="#item-row-{{ .Item.ID }}" 
                    hx-swap="outerHTML"
                    title="Save">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
            <button class="btn btn-secondary btn-icon" 
                    hx-get="/items/row/{{ .Item.ID }}" 
                    hx-target="#item-row-{{ .Item.ID }}" 
                    hx-swap="outerHTML"
                    title="Cancel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
{{ end }}
