{{ define "receiving_logs.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
{{ template "receive_stock_form.html" . }}

<div class="card">
    <div class="header-bar">
        <h2>Receiving Logs</h2>
        <button type="button" onclick="toggleReceiveStockForm()" class="btn"
            style="padding: 0.5rem 1rem; text-decoration: none; font-size: 0.8125rem; cursor: pointer;">
            📦 Receive Stock
        </button>
    </div>

    <form style="display: contents;" onsubmit="return false;" hx-indicator="#receiving-loading-indicator">
        <div class="search-filter-bar">
            <div class="flex-grow">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
                <input type="text" name="search" placeholder="Search by PL No. or Item Code..."
                    hx-get="/inventory/receiving/logs" hx-trigger="keyup changed delay:300ms, search"
                    hx-target="#receiving-logs-results" hx-include="closest form"
                    hx-indicator="#receiving-loading-indicator" class="form-input">
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Supplier</label>
                <select name="supplier_filter" class="form-input" hx-get="/inventory/receiving/logs"
                    hx-target="#receiving-logs-results" hx-include="closest form" hx-trigger="change"
                    hx-indicator="#receiving-loading-indicator">
                    <option value="all">All Suppliers</option>
                    {{ range .Suppliers }}
                    <option value="{{ . }}" {{ if eq . $.SupplierFilter }}selected{{ end }}>{{ . }}</option>
                    {{ end }}
                </select>
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort
                    By</label>
                <select name="sort" class="form-input" hx-get="/inventory/receiving/logs"
                    hx-target="#receiving-logs-results" hx-include="closest form" hx-trigger="change"
                    hx-indicator="#receiving-loading-indicator">
                    <option value="date_desc">Newest First</option>
                    <option value="date_asc">Oldest First</option>
                    <option value="qty_desc">Highest Quantity First</option>
                </select>
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Show
                    Rows</label>
                <select name="limit" class="form-input" hx-get="/inventory/receiving/logs"
                    hx-target="#receiving-logs-results" hx-include="closest form" hx-trigger="change"
                    hx-indicator="#receiving-loading-indicator">
                    <option value="25" selected>Top 25</option>
                    <option value="50">Top 50</option>
                    <option value="100">Top 100</option>
                    <option value="200">Top 200</option>
                    <option value="500">Top 500</option>
                </select>
            </div>
        </div>

        <div id="receiving-loading-indicator" class="htmx-indicator">
            <div class="spinner-sm"></div>
            <span>Searching & filtering receiving logs...</span>
        </div>

        <div id="receiving-logs-results">
            {{ template "receiving_logs_results.html" . }}
        </div>
    </form>
</div>

<script>
    (function () {
        const DEFAULT_RECEIVING_COL_WIDTHS = {
            date: 100,
            pl_no: 100,
            supplier: 90,
            qty: 70,
            description: 200,
            uom: 70,
            unit_price: 90,
            less1: 75,
            less2: 75,
            unit_cost: 90,
            total_cost: 95,
            markup: 75,
            selling_price: 100,
            remarks: 130,
            actions: 90
        };

        function getReceivingColumnWidths() {
            try {
                const stored = localStorage.getItem('radline_receiving_column_widths');
                if (stored) {
                    return JSON.parse(stored);
                }
            } catch (e) {
                console.error('Failed to parse receiving column widths', e);
            }
            return Object.assign({}, DEFAULT_RECEIVING_COL_WIDTHS);
        }

        let currentReceivingColumnWidths = getReceivingColumnWidths();

        function saveReceivingColumnWidths() {
            try {
                localStorage.setItem('radline_receiving_column_widths', JSON.stringify(currentReceivingColumnWidths));
            } catch (e) {
                console.error('Failed to save receiving column widths', e);
            }
        }

        window.applyReceivingColumnWidths = function () {
            let styleEl = document.getElementById('receiving-column-widths-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'receiving-column-widths-style';
                document.head.appendChild(styleEl);
            }

            const cssRules = [];
            Object.keys(currentReceivingColumnWidths).forEach(colKey => {
                const w = currentReceivingColumnWidths[colKey];
                if (w) {
                    cssRules.push(`
                        .receiving-logs-table .th[data-col="${colKey}"],
                        .receiving-logs-table .td[data-col="${colKey}"] {
                            width: ${w}px !important;
                            min-width: ${w}px !important;
                            max-width: ${w}px !important;
                            box-sizing: border-box;
                        }
                    `);
                }
            });

            styleEl.textContent = cssRules.join('\n');
        };

        window.initReceivingColumnResizing = function () {
            const headers = document.querySelectorAll('.receiving-logs-table .th[data-col]');
            headers.forEach(th => {
                if (th.querySelector('.table-col-resizer')) return;

                const resizer = document.createElement('div');
                resizer.className = 'table-col-resizer';
                th.appendChild(resizer);

                const colKey = th.getAttribute('data-col');

                let startX = 0;
                let startWidth = 0;

                const onPointerDown = function (e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    startX = clientX;
                    startWidth = th.offsetWidth;

                    resizer.classList.add('resizing');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    const onPointerMove = function (moveEvent) {
                        const currentX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                        const deltaX = currentX - startX;
                        const newWidth = Math.max(40, startWidth + deltaX);

                        currentReceivingColumnWidths[colKey] = newWidth;
                        window.applyReceivingColumnWidths();
                    };

                    const onPointerUp = function () {
                        resizer.classList.remove('resizing');
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';

                        document.removeEventListener('mousemove', onPointerMove);
                        document.removeEventListener('mouseup', onPointerUp);
                        document.removeEventListener('touchmove', onPointerMove);
                        document.removeEventListener('touchend', onPointerUp);

                        saveReceivingColumnWidths();
                    };

                    document.addEventListener('mousemove', onPointerMove);
                    document.addEventListener('mouseup', onPointerUp);
                    document.addEventListener('touchmove', onPointerMove, { passive: false });
                    document.addEventListener('touchend', onPointerUp);
                };

                resizer.addEventListener('mousedown', onPointerDown);
                resizer.addEventListener('touchstart', onPointerDown, { passive: false });

                resizer.addEventListener('dblclick', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (DEFAULT_RECEIVING_COL_WIDTHS[colKey]) {
                        currentReceivingColumnWidths[colKey] = DEFAULT_RECEIVING_COL_WIDTHS[colKey];
                    } else {
                        delete currentReceivingColumnWidths[colKey];
                    }
                    saveReceivingColumnWidths();
                    window.applyReceivingColumnWidths();
                });
            });
        };

        window.applyReceivingColumnWidths();
        window.initReceivingColumnResizing();
    })();

    document.body.addEventListener('htmx:afterSwap', function (evt) {
        if (typeof window.applyReceivingColumnWidths === 'function') {
            window.applyReceivingColumnWidths();
        }
        if (typeof window.initReceivingColumnResizing === 'function') {
            window.initReceivingColumnResizing();
        }
    });

    document.body.addEventListener('stock-received', function () {
        const searchInput = document.querySelector('input[name="search"]');
        if (searchInput) {
            htmx.trigger(searchInput, 'search');
        }
    });

    // Autocompute selling price from Unit Cost, Less 1, Less 2, and Markup
    document.addEventListener('input', function (e) {
        const target = e.target;
        if (!target.matches('input[name="unit_price"], input[name="less1"], input[name="less2"], input[name="markup"]')) {
            return;
        }

        const row = target.closest('.item-grid-row, tr.editing-row, .tr.editing-row');
        if (!row) return;

        const unitPriceInput = row.querySelector('input[name="unit_price"]');
        const less1Input = row.querySelector('input[name="less1"]');
        const less2Input = row.querySelector('input[name="less2"]');
        const markupInput = row.querySelector('input[name="markup"]');

        if (!unitPriceInput || !markupInput) return;

        const unitPrice = parseFloat(unitPriceInput.value) || 0;
        const less1 = less1Input ? (parseFloat(less1Input.value) || 0) : 0;
        const less2 = less2Input ? (parseFloat(less2Input.value) || 0) : 0;
        const markup = parseFloat(markupInput.value) || 130;

        const cost = unitPrice * (1 - less1 / 100) * (1 - less2 / 100);
        const sellingPrice = cost * markup / 100;

        // Display updated calculated values if matching display containers exist in edit/view rows
        const sellingPriceCell = row.querySelector('.calc-selling-price');
        if (sellingPriceCell) {
            sellingPriceCell.textContent = '₱' + sellingPrice.toFixed(2);
        }
        const costCell = row.querySelector('.calc-cost');
        if (costCell) {
            costCell.textContent = '₱' + cost.toFixed(2);
        }
    });
</script>
{{ end }}
