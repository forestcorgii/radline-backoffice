{{ define "receiving_logs.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="card">
    <h2>Receiving Logs</h2>

    <form style="display: contents;" onsubmit="return false;">
        <div class="search-filter-bar">
            <div class="flex-grow">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
                <input type="text" name="search" placeholder="Search by PL No. or Item Code..."
                    hx-get="/inventory/receiving/logs" hx-trigger="keyup changed delay:300ms, search"
                    hx-target="#receiving-logs-results" hx-include="closest form" class="form-input">
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Supplier</label>
                <select name="supplier_filter" class="form-input" hx-get="/inventory/receiving/logs"
                    hx-target="#receiving-logs-results" hx-include="closest form" hx-trigger="change">
                    <option value="all">All Suppliers</option>
                    {{ range .Suppliers }}
                    <option value="{{ . }}" {{ if eq . $.SupplierFilter }}selected{{ end }}>{{ . }}</option>
                    {{ end }}
                </select>
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort
                    By</label>
                <select name="sort" class="form-input" hx-get="/inventory/receiving/logs"
                    hx-target="#receiving-logs-results" hx-include="closest form" hx-trigger="change">
                    <option value="date_desc">Newest First</option>
                    <option value="date_asc">Oldest First</option>
                    <option value="qty_desc">Highest Quantity First</option>
                </select>
            </div>
            <div class="filter-item">
                <label
                    style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Show
                    Rows</label>
                <select name="limit" class="form-input" hx-get="/inventory/receiving/logs"
                    hx-target="#receiving-logs-results" hx-include="closest form" hx-trigger="change">
                    <option value="25" selected>Top 25</option>
                    <option value="50">Top 50</option>
                    <option value="100">Top 100</option>
                    <option value="200">Top 200</option>
                    <option value="500">Top 500</option>
                </select>
            </div>
        </div>

        <div id="receiving-logs-results">
            {{ template "receiving_logs_results.html" . }}
        </div>
    </form>
</div>
{{ end }}
