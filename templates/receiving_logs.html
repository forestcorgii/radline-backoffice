{{ define "receiving_logs.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="card">
    <h2>Receiving Logs</h2>
    
    <div class="search-filter-bar">
        <div class="flex-grow">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
            <input type="text" name="search" placeholder="Search by PL No or item code..." 
                   hx-get="/inventory/receiving/logs" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#receiving-logs-tbody" 
                   hx-include="[name='supplier_filter'],[name='sort']"
                   class="form-input">
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Supplier Filter</label>
            <select name="supplier_filter" 
                    hx-get="/inventory/receiving/logs" 
                    hx-target="#receiving-logs-tbody" 
                    hx-include="[name='search'],[name='sort']"
                    hx-trigger="change"
                    class="form-input">
                <option value="all">All Suppliers</option>
                <option value="ASCD">ASCD</option>
                <option value="RENOWN">RENOWN</option>
                <option value="OTHER">OTHER</option>
            </select>
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort By</label>
            <select name="sort" 
                    hx-get="/inventory/receiving/logs" 
                    hx-target="#receiving-logs-tbody" 
                    hx-include="[name='search'],[name='supplier_filter']"
                    hx-trigger="change"
                    class="form-input">
                <option value="date_desc">Newest First</option>
                <option value="date_asc">Oldest First</option>
                <option value="qty_desc">Highest Quantity First</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table class="table-scroll-md">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>PL No.</th>
                    <th>Supplier</th>
                    <th>Item Code</th>
                    <th>Qty</th>
                    <th>UOM</th>
                    <th>Selling Price</th>
                    <th>Total Cost</th>
                </tr>
            </thead>
            <tbody id="receiving-logs-tbody">
                {{ template "receiving_rows.html" .ReceivingLogs }}
            </tbody>
        </table>
    </div>

    <div id="receiving-pagination">
        {{ template "pagination.html" .PaginationView }}
    </div>
</div>
{{ end }}
