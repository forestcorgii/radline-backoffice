{{ define "brands_results.html" }}
<div class="listview-summary-bar">
    <div class="listview-summary-count">
        <span>Showing <strong>{{ len .Brands }}</strong> brands</span>
    </div>
</div>
<div class="table-container">
    <table class="table-scroll-md resizable-table brands-table" id="brands-table">
        <thead>
            <tr>
                <th data-col="code">Code</th>
                <th data-col="name">Name</th>
                <th data-col="items_count">Items Count</th>
                <th data-col="actions">Actions</th>
            </tr>
        </thead>
        <tbody id="brands-tbody">
            {{ template "brand_rows.html" .Brands }}
        </tbody>
    </table>
</div>
{{ end }}
