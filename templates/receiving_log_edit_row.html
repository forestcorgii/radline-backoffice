{{ define "receiving_log_edit_row.html" }}
<div id="receiving-log-row-{{ .ID }}" class="tr editing-row" style="background: var(--bg-secondary);">
    <div class="td" data-col="date">{{ .Date.Format "2006-01-02" }}</div>
    <div class="td" data-col="pl_no">{{ if .PLNo }}{{ .PLNo }}{{ else }}-{{ end }}</div>
    <div class="td" data-col="supplier"><span class="badge badge-primary">{{ .Supplier }}</span></div>
    <div class="td" data-col="qty">
        <input type="number" step="any" name="qty" form="edit-form-{{ .ID }}" class="form-input" value="{{ .Qty }}" style="width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem; font-size: 0.8125rem;">
    </div>
    <div class="td" data-col="description" style="font-weight: 500;">{{ .Description }}</div>
    <div class="td" data-col="uom">{{ .UOM }}</div>
    <div class="td" data-col="unit_price">
        <input type="number" step="any" name="unit_price" form="edit-form-{{ .ID }}" class="form-input" value="{{ printf "%.2f" .UnitPrice }}" style="width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem; font-size: 0.8125rem;">
    </div>
    <div class="td" data-col="less1">
        <input type="number" step="any" name="less1" form="edit-form-{{ .ID }}" class="form-input" value="{{ printf "%.1f" .Less1 }}" style="width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem; font-size: 0.8125rem;">
    </div>
    <div class="td" data-col="less2">
        <input type="number" step="any" name="less2" form="edit-form-{{ .ID }}" class="form-input" value="{{ printf "%.1f" .Less2 }}" style="width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem; font-size: 0.8125rem;">
    </div>
    <div class="td" data-col="unit_cost" class="calc-cost">₱{{ printf "%.2f" .Cost }}</div>
    <div class="td" data-col="total_cost">₱{{ printf "%.2f" .TotalCost }}</div>
    <div class="td" data-col="markup">
        <input type="number" step="any" name="markup" form="edit-form-{{ .ID }}" class="form-input" value="{{ printf "%.0f" .Markup }}" style="width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem; font-size: 0.8125rem;">
    </div>
    <div class="td" data-col="selling_price" class="calc-selling-price">₱{{ printf "%.2f" .SellingPrice }}</div>
    <div class="td" data-col="remarks">
        <input type="text" name="remarks" form="edit-form-{{ .ID }}" class="form-input" value="{{ .Remarks }}" style="width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem; font-size: 0.8125rem;">
    </div>
    <div class="td" data-col="actions">
        <form id="edit-form-{{ .ID }}"
            hx-post="/inventory/receiving/logs/edit/{{ .ID }}"
            hx-target="#receiving-log-row-{{ .ID }}"
            hx-swap="outerHTML"
            style="display: contents;">
        </form>
        <div class="actions-cell">
            <button type="submit" form="edit-form-{{ .ID }}" class="btn btn-icon" title="Save" style="background: var(--success-color); color: white;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
            <button type="button" class="btn btn-secondary btn-icon"
                hx-get="/inventory/receiving/logs/edit/{{ .ID }}"
                hx-target="#receiving-log-row-{{ .ID }}"
                hx-swap="outerHTML"
                onclick="location.reload()"
                title="Cancel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
{{ end }}
