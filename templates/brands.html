{{ define "brands.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div class="header-bar">
    <h2 style="margin: 0;">Brands</h2>
    <button type="button" class="btn" onclick="toggleAddBrandForm()" style="padding: 0.5rem 1rem; font-size: 0.8125rem; cursor: pointer;">
        + Add Brand
    </button>
</div>

<!-- Add Brand Form Card (hidden by default, shown when + Add Brand is clicked) -->
<div class="card mb-4" id="add-brand-card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h3 style="font-size: 1.125rem; font-weight: 600; margin: 0;">Add New Brand</h3>
        <button type="button" class="btn btn-secondary" onclick="toggleAddBrandForm()" style="padding: 0.35rem 0.75rem; font-size: 0.8125rem;">
            ✕ Close
        </button>
    </div>
    <form hx-post="/brands/add" hx-swap="none" hx-on::after-request="if(event.detail.successful && event.detail.elt === this) { this.reset(); toggleAddBrandForm(); }">
        <div class="grid grid-cols-2">
            <div class="form-group">
                <label for="brand_name">Brand Name</label>
                <input type="text" id="brand_name" name="name" required class="form-input" oninput="autoGenerateBrandCodeInBrands()">
            </div>
            <div class="form-group">
                <label for="brand_code">Brand Code</label>
                <input type="text" id="brand_code" name="code" required class="form-input">
            </div>
        </div>
        <div style="display: flex; gap: 0.5rem;" class="mt-4">
            <button type="submit" class="btn">Save Brand</button>
            <button type="button" onclick="toggleAddBrandForm()" class="btn btn-secondary">Cancel</button>
        </div>
    </form>
</div>

<div class="card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Brands List</h3>
    <form style="display: contents;" onsubmit="return false;">
    <div class="search-filter-bar">
        <div class="flex-grow">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Search</label>
            <input type="text" name="search" placeholder="Search by code or name..." 
                   hx-get="/brands" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#brands-results" 
                   hx-include="closest form"
                   class="form-input">
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Usage Status</label>
            <select name="filter" class="form-input"
                    hx-get="/brands" 
                    hx-target="#brands-results" 
                    hx-include="closest form"
                    hx-trigger="change">
                <option value="all">All Usage Statuses</option>
                <option value="in_use">In Use</option>
                <option value="unused">Unused</option>
            </select>
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Sort By</label>
            <select name="sort" class="form-input"
                    hx-get="/brands" 
                    hx-target="#brands-results" 
                    hx-include="closest form"
                    hx-trigger="change">
                <option value="code_asc">Code (A-Z)</option>
                <option value="code_desc">Code (Z-A)</option>
                <option value="name_asc">Name (A-Z)</option>
                <option value="name_desc">Name (Z-A)</option>
                <option value="items_desc">Most Items First</option>
                <option value="items_asc">Least Items First</option>
            </select>
        </div>
        <div class="filter-item">
            <label style="margin-bottom: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block;">Show Rows</label>
            <select name="limit" class="form-input"
                    hx-get="/brands" 
                    hx-target="#brands-results" 
                    hx-include="closest form"
                    hx-trigger="change">
                <option value="25" selected>Top 25</option>
                <option value="50">Top 50</option>
                <option value="100">Top 100</option>
                <option value="200">Top 200</option>
                <option value="500">Top 500</option>
            </select>
        </div>
    </div>

    <div id="brands-results">
    <div class="table-container">
        <table class="table-scroll-md">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Items Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="brands-tbody">
                {{ template "brand_rows.html" .Brands }}
            </tbody>
        </table>
    </div>
    </div>
    </form>
</div>

<script>
    function toggleAddBrandForm() {
        const card = document.getElementById('add-brand-card');
        if (!card) return;
        if (card.style.display === 'none' || card.style.display === '') {
            card.style.display = 'block';
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            card.style.display = 'none';
        }
    }

    function autoGenerateBrandCodeInBrands() {
        const nameInput = document.getElementById('brand_name');
        const codeInput = document.getElementById('brand_code');
        if (!nameInput || !codeInput) return;
        const name = nameInput.value.trim();
        if (!name) return;
        const isAutoGen = codeInput.dataset.autogenerated === 'true';
        if (codeInput.value && !isAutoGen) return;
        const firstChar = name[0];
        const rest = name.slice(1).replace(/[aeiouAEIOU]/g, '');
        codeInput.value = (firstChar + rest).toUpperCase();
        codeInput.dataset.autogenerated = 'true';
    }

    document.body.addEventListener('brand-added', function () {
        const searchInput = document.querySelector('input[name="search"]');
        if (searchInput) {
            htmx.trigger(searchInput, 'search');
        }
    });
</script>
{{ end }}
