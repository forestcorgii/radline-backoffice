{{ define "items_results.html" }}
<div class="table-container">
    <div class="table table-scroll-md resizable-table items-table">
        <div class="thead">
            <div class="tr">
                <div class="th" data-col="description">Description</div>
                <div class="th" data-col="model">Model</div>
                <div class="th" data-col="brand">Brand</div>
                <div class="th" data-col="category">Category</div>
                <div class="th" data-col="default_uom">Default UOM</div>
                <div class="th" data-col="actions">Actions</div>
            </div>
        </div>
        <div class="tbody" id="items-tbody">
            {{ template "item_rows.html" .Items }}
        </div>
    </div>
</div>
{{ end }}
