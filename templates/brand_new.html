{{ define "brand_new.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div style="margin-bottom: 1.5rem;">
    <a href="/brands" hx-get="/brands" hx-target="#main-content" hx-push-url="true" class="btn btn-secondary" style="padding: 0.5rem 1rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
        ← Back to Brands
    </a>
</div>

<div class="card">
    <h2 class="mb-4">Add Brand</h2>
    <form hx-post="/brands/add" hx-swap="none">
        <div class="grid grid-cols-2">
            <div class="form-group">
                <label for="code">Brand Code</label>
                <input type="text" id="code" name="code" required>
            </div>
            <div class="form-group">
                <label for="name">Brand Name</label>
                <input type="text" id="name" name="name" required>
            </div>
        </div>
        <button type="submit" class="btn mt-4">Save Brand</button>
    </form>
</div>
{{ end }}
