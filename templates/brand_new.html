{{ define "brand_new.html" }}
{{ template "base.html" . }}
{{ end }}

{{ define "content" }}
<div style="margin-bottom: 1.5rem;">
    <a href="/brands" hx-get="/brands" hx-target="#main-content" hx-push-url="true" class="btn btn-secondary" style="padding: 0.5rem 1rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem;">
        ← Back to Brands
    </a>
</div>

<div class="card">
    <h2 class="mb-4">Add Brand</h2>
    <form hx-post="/brands/add" hx-swap="none">
        <div class="grid grid-cols-2">
            <div class="form-group">
                <label for="name">Brand Name</label>
                <input type="text" id="name" name="name" required
                       oninput="autoGenerateBrandCode()">
            </div>
            <div class="form-group">
                <label for="code">Brand Code</label>
                <input type="text" id="code" name="code" required>
            </div>
        </div>
        <button type="submit" class="btn mt-4">Save Brand</button>
    </form>
</div>

<script>
// Auto-generates a brand code from the brand name by removing all vowels
// except the first character. The code input is only auto-filled when it's
// empty or was previously auto-generated (tracked via data-autogenerated).
// The user can freely override the generated code at any time.
function autoGenerateBrandCode() {
    const nameInput = document.getElementById('name');
    const codeInput = document.getElementById('code');
    if (!nameInput || !codeInput) return;

    const name = nameInput.value.trim();
    if (!name) return;

    // Only auto-fill if code is empty or was previously auto-generated
    const isAutoGen = codeInput.dataset.autogenerated === 'true';
    if (codeInput.value && !isAutoGen) return;

    // Keep first character as-is, remove vowels from the rest
    const firstChar = name[0];
    const rest = name.slice(1).replace(/[aeiouAEIOU]/g, '');
    const generated = firstChar + rest;

    codeInput.value = generated.toUpperCase();
    codeInput.dataset.autogenerated = 'true';
}

// When user manually edits the code, clear the autogenerated flag
document.addEventListener('DOMContentLoaded', function () {
    const codeInput = document.getElementById('code');
    if (codeInput) {
        codeInput.addEventListener('input', function () {
            if (this.dataset.autogenerated === 'true') {
                // If user has made any change to an auto-generated value,
                // clear the flag so future name changes don't overwrite it
                this.dataset.autogenerated = '';
            }
        });
    }
});
</script>
{{ end }}
