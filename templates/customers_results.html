                <th style="width: 140px;">TIN No.</th>
                <th style="min-width: 220px;">Address</th>
                <th style="min-width: 160px;">Contact & Phone</th>

        <tbody id="customers-tbody">
            {{ template "customer_rows.html" .Customers }}
        </tbody>
